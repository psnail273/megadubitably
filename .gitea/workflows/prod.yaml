name: Build and Deploy Docker Container (Production)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Private Registry
        uses: docker/login-action@v2
        with:
          registry: git.stuffworks.net
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            git.stuffworks.net/psnail273/megadubitably:latest
            git.stuffworks.net/psnail273/megadubitably:${{ github.sha }}
          cache-from: type=registry,ref=git.stuffworks.net/psnail273/megadubitably:latest
          cache-to: type=inline

      - name: Deploy container
        run: |
          docker pull git.stuffworks.net/psnail273/megadubitably:latest
          docker stop megadubitably || true
          docker rm megadubitably || true
          docker run -d \
            --name megadubitably \
            --restart unless-stopped \
            --network caddy-network \
            -e CONTACT_EMAIL=${{ secrets.CONTACT_EMAIL }} \
            -e RESEND_API_KEY=${{ secrets.RESEND_API_KEY }} \
            git.stuffworks.net/psnail273/megadubitably:latest

